# Revalidation: a planned stop is skipped when it no longer passes the rules. As due_on_arrival, but cone_3 stays:
# the first leg plans a stop for about 46 s, when its belief (known from a peer at t = 0) will have decayed below 0.5.
# On the way the robot's own camera sees the cone and confirms it, the ledger refreshes it (belief 1), and when the
# robot reaches the stop the check is skipped ("belief 1.00 > 0.50") instead of stopping to look at a cone it
# has just seen. Run with: roslaunch mattbot_sim sim.launch scenario:=resighted_before_stop observe_check_below_belief:=0.5
name: resighted_before_stop
map: current_map
launch_args: {observe_check_below_belief: 0.5}   # fast sim and run_fleet.py; for sim.launch pass it as an arg
start: {x: 28.0, y: 18.95, theta: 0.0}
objects:
  - {id: cone_3, class: cone, x: 43.0, y: 18.15, width: 0.3, known_from_peer: true}
waypoints:   # a short first leg: the peer's report is in the ledger when the leg east is planned
  - {x: 30.0, y: 18.95, theta: 0.0, pause_s: 2}
  - {x: 46.0, y: 18.95, theta: 3.14159}
  - {x: 28.0, y: 18.95, theta: 0.0}
loop: true
duration: 55
expect:
  min_stops_skipped: 1
  observation_stops.STARTED: 0
  false_removals: 0
  goal_resends: 0
