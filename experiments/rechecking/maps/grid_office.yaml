# The main re-checking experiment on the synthetic map grid_office (mattbot_sim/maps, scripts/make_maps.py):
# a 3 x 4 corridor grid, high redundancy (every blocked corridor has a short way around). Same workload,
# obstacles, conditions and seeds as ../main.yaml.
extends: ../main.yaml
name: rechecking_grid_office
map: grid_office
landmarks: ../../landmarks_grid_office.yaml
robots:
  - {id: 91, start: {x: 12.0, y: 4.0, theta: 0.0}}
  - {id: 92, start: {x: 30.0, y: 20.0, theta: 0.0}}
  - {id: 93, start: {x: 48.0, y: 36.0, theta: 3.14159}}
