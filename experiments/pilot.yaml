# Pilot experiment: does re-checking help? Three robots run the same 40 trips between landmarks on current_map
# while four obstacles appear (in passages that have a way around) and are later taken away. Conditions add the
# re-checking mechanisms one by one; every condition runs the same seeded instances (tasks, obstacle placements
# and times). Run:  python3 mattbot_sim/scripts/experiment.py run mattbot_sim/experiments/pilot.yaml --jobs 4
name: pilot
map: current_map
landmarks: landmarks_current_map.yaml
robots:
  - {id: 91, start: {x: 28.0, y: 18.95, theta: 0.0}}
  - {id: 92, start: {x: 60.0, y: 18.95, theta: 3.14159}}
  - {id: 93, start: {x: 44.0, y: 4.0, theta: 0.0}}
tasks:
  count: 40
  release_rate_per_min: 2.0      # Poisson releases: about 20 min of work arriving
  dwell_s: 5                     # wait at each destination before the next task
obstacles:
  count: 4
  min_importance_m: 1.0          # only placements that cost the fleet at least 1 m per trip on average
  width_m: 1.0                   # wide enough to block a corridor for the planner
  classes: [chair, cone, bench]
  appear_s: [0, 600]
  lifetime_s: [300, 900]         # removed this long after appearing
  min_separation_m: 3.0
  clearance_m: 2.0               # never on a landmark or a robot start
max_duration_s: 3600
common:                          # the robots' real belief model and check settings (not the sim's fast defaults)
  belief_hold_s: 60
  belief_decay_s: 120
  observe_check_below_belief: 0.5
  observe_cooldown_s: 120
  observe_dwell_s: 4
  ledger_blockout: true          # the fleet plans around every ledger object until it is removed
conditions:
  none: {observe: false}
  opportunistic: {observe: true}
  detour: {observe: true, observe_detour: true}
  scout: {observe: true, observe_detour: true, observe_scout: true, observe_scout_execute: true}
seeds: 5
